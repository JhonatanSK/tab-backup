name: Check extension
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npx --yes pnpm@12.8.1 install --frozen-lockfile
      - run: npx --yes pnpm@12.8.1 lint
      - run: npx --yes pnpm@12.8.1 typecheck
      - run: npx --yes pnpm@12.8.1 test
      - run: npx --yes pnpm@12.8.1 format:check
      - run: npx --yes pnpm@12.8.1 build
      - run: npx --yes pnpm@12.8.1 exec playwright install --with-deps chromium
      - run: npx --yes pnpm@12.8.1 test:e2e
      - run: python3 scripts/package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tabbackup-release
          path: dist/releases/
